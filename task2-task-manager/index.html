<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster Pro | CRUD Productivity Workspace</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Top App Bar -->
        <header class="app-header">
            <div class="header-container">
                <div class="brand">
                    <div class="brand-icon">
                        <i class="fas fa-check-double"></i>
                    </div>
                    <div>
                        <h1>TaskMaster Pro</h1>
                        <span class="brand-sub">Datheon Full Stack Task 2 • Paras Nakum</span>
                    </div>
                </div>
                <div class="header-right">
                    <span class="status-indicator"><i class="fas fa-cloud-check"></i> LocalStorage Synced</span>
                    <a href="../index.html" class="btn btn-sm btn-outline"><i class="fas fa-arrow-left"></i> Hub</a>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-container">
            <!-- Metrics Bar -->
            <section class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-icon total-icon"><i class="fas fa-layer-group"></i></div>
                    <div class="metric-data">
                        <span class="metric-value" id="totalTasksCount">0</span>
                        <span class="metric-label">Total Tasks</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon pending-icon"><i class="fas fa-clock"></i></div>
                    <div class="metric-data">
                        <span class="metric-value" id="activeTasksCount">0</span>
                        <span class="metric-label">Pending</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon completed-icon"><i class="fas fa-circle-check"></i></div>
                    <div class="metric-data">
                        <span class="metric-value" id="completedTasksCount">0</span>
                        <span class="metric-label">Completed</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon rate-icon"><i class="fas fa-chart-pie"></i></div>
                    <div class="metric-data">
                        <span class="metric-value" id="completionRate">0%</span>
                        <span class="metric-label">Completion Velocity</span>
                    </div>
                </div>
            </section>

            <!-- Task Creation Form Card -->
            <section class="card form-card">
                <div class="card-header">
                    <h2><i class="fas fa-plus-circle"></i> Create New Task</h2>
                </div>
                <form id="taskForm" class="task-form">
                    <div class="form-row">
                        <div class="form-group flex-2">
                            <label for="taskTitle">Task Title <span class="req">*</span></label>
                            <input type="text" id="taskTitle" placeholder="e.g. Implement authentication middleware" required>
                        </div>
                        <div class="form-group flex-1">
                            <label for="taskCategory">Category</label>
                            <select id="taskCategory">
                                <option value="Work">💼 Work</option>
                                <option value="Study">📚 Study</option>
                                <option value="Personal">🏠 Personal</option>
                                <option value="Coding">💻 Coding</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label for="taskPriority">Priority Level</label>
                            <select id="taskPriority">
                                <option value="Medium">⚡ Medium</option>
                                <option value="High">🔥 High</option>
                                <option value="Low">🌱 Low</option>
                            </select>
                        </div>
                        <div class="form-group flex-1">
                            <label for="taskDueDate">Due Date</label>
                            <input type="date" id="taskDueDate">
                        </div>
                        <div class="form-group flex-1">
                            <label>&nbsp;</label>
                            <button type="submit" class="btn btn-primary btn-block">
                                <i class="fas fa-plus"></i> Add Task
                            </button>
                        </div>
                    </div>
                </form>
            </section>

            <!-- Filtering & Search Control Bar -->
            <section class="controls-card">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search tasks by title...">
                </div>

                <div class="filter-group">
                    <div class="filter-tabs" id="statusFilterTabs">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="active">Active</button>
                        <button class="filter-btn" data-filter="completed">Completed</button>
                    </div>

                    <div class="category-dropdown-wrap">
                        <select id="categoryFilter" class="select-filter">
                            <option value="all">All Categories</option>
                            <option value="Work">Work</option>
                            <option value="Study">Study</option>
                            <option value="Personal">Personal</option>
                            <option value="Coding">Coding</option>
                        </select>
                    </div>

                    <button class="btn btn-danger-outline btn-sm" id="clearCompletedBtn" title="Clear all completed tasks">
                        <i class="fas fa-trash-can"></i> Clear Done
                    </button>
                </div>
            </section>

            <!-- Task List View -->
            <section class="task-list-section">
                <ul class="task-list" id="taskList">
                    <!-- Dynamic Task items injected via JavaScript -->
                </ul>

                <div class="empty-state" id="emptyState" style="display: none;">
                    <i class="fas fa-clipboard-check"></i>
                    <h3>No tasks found</h3>
                    <p>Add a new task or adjust your search filters to display tasks.</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Edit Task Modal -->
    <div class="modal" id="editModal">
        <div class="modal-backdrop"></div>
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fas fa-pen-to-square"></i> Edit Task</h3>
                <button class="btn-close" id="closeEditModal">&times;</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editTaskId">
                <div class="form-group">
                    <label for="editTaskTitle">Task Title</label>
                    <input type="text" id="editTaskTitle" required>
                </div>
                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="editTaskCategory">Category</label>
                        <select id="editTaskCategory">
                            <option value="Work">💼 Work</option>
                            <option value="Study">📚 Study</option>
                            <option value="Personal">🏠 Personal</option>
                            <option value="Coding">💻 Coding</option>
                        </select>
                    </div>
                    <div class="form-group flex-1">
                        <label for="editTaskPriority">Priority</label>
                        <select id="editTaskPriority">
                            <option value="High">🔥 High</option>
                            <option value="Medium">⚡ Medium</option>
                            <option value="Low">🌱 Low</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="editTaskDueDate">Due Date</label>
                    <input type="date" id="editTaskDueDate">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelEditBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
